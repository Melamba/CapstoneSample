<body>
    
    <div class = pRibbon>

            <div class = divc>

                            <div class = idInfo>
                                <H3>VISITOR INFORMATION CARD</H1>
                                <div class=idInfoChild>Name: </div>

                            </div>
                </div></div>  
                </div>
            </div>
            </div>
    </div>
</body>
    <script>
        
        var map = L.map('map',{
             minZoom: 17.5,
            maxZoom: 24,
            maxBounds: [
              [14.661016559725885, 120.98713847292149],
                [14.657335733123084, 120.98542608229778]
            ],
            maxBoundsViscosity: 1.0
        }).setView([14.65835117638478,120.98624458460917],20);
        L.tileLayer('https://api.maptiler.com/maps/openstreetmap/{z}/{x}/{y}.jpg?key=76drzXxYrFFwuQRnFNKS' , {
            attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
            minZoom: 17.5,
            maxZoom: 22,
            maxNativeZoom: 19
        }).addTo(map);
         var leafletIcon = L.icon({
            iconUrl:'https://64.media.tumblr.com/193610c5a76a3e0801f40790981a2816/a50f3003a25ecf54-d3/s400x600/adca53d6e4fc0485806a187e2918672c2ffebe74.pnj', 
            iconSize: [33,29],
           
        })  
        
        var adminMarker = L.marker([14.657660229212729, 120.98671314851723],{icon:leafletIcon}).addTo(map).bindPopup("Admin Building");
        var fdtMarker = L.marker([14.65834967909162, 120.98625004709956],{icon:leafletIcon}).addTo(map).bindPopup("FDT");
        var anatomyMarker = L.marker([14.658000163009532, 120.9867319239792],{icon:leafletIcon}).addTo(map).bindPopup("Anatomy Building");
        var archMarker = L.marker([14.65776532330548, 120.98641274112585],{icon:leafletIcon}).addTo(map).bindPopup("Arch");
        var pgtMarker = L.marker([14.659267858564103, 120.98567713880672],{icon:leafletIcon}).addTo(map).bindPopup("PGT Building");
        var gplMarker = L.marker([14.659045187468603, 120.98609128594734],{icon:leafletIcon}).addTo(map).bindPopup("GPL Building");
        var lrcMarker = L.marker([14.659267123462485, 120.98645539027785],{icon:leafletIcon}).addTo(map).bindPopup("LRC Building");
        var pocMarker = L.marker([14.66049141773283, 120.98591887871622],{icon:leafletIcon}).addTo(map).bindPopup("Purple Owl Complex");
        var cgMarker = L.marker([14.660531785242888, 120.98636658748819],{icon:leafletIcon}).addTo(map).bindPopup("Centennial Gymnasium");
        
        L.control.scale({
            metric: true
        }).addTo(map);

        navigator.geolocation.watchPosition(success,error)
        function success(pos)
        {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy; 
            let marker = L.marker([lat,lng]).addTo(map);
            let circle = L.circle([lat,lng], {radius : accuracy }).addTo(map);
            let teleporter = map.fitBounds(circle.getBounds());
            
        }
        
        function error(err)
        {
            if (err.code === 1) 
            {
                alert("Please Allow Access for the geolocation");

            }
            else
            {
                alert("cannot get current location");
            }
        }
    </script>
</html>
